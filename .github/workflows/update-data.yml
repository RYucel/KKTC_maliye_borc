name: Veri Güncelle

on:
  # Günde iki kez çalıştır (06:00 ve 18:00 UTC = 09:00 ve 21:00 TR)
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  # Manuel tetikleme
  workflow_dispatch:

permissions:
  contents: write

# Bilgisayar kapalıyken birikmesin: yeni çalıştırma bekleyeni iptal eder
concurrency:
  group: update-data

jobs:
  update:
    # mb.gov.ct.tr GitHub sunucularına yanıt vermiyor (2026-10-28'den beri);
    # bu yüzden yerel Windows bilgisayardaki self-hosted runner'da çalışıyor
    runs-on: [self-hosted, Windows, kktc-scraper]
    defaults:
      run:
        # Düz "bash" WSL'e çözülüyor; Git Bash'i açıkça kullan
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail {0}'
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: python -m pip install --quiet -r requirements.txt

      - name: Scraper'ı çalıştır (DİBS Borç)
        run: python scraper.py data.json

      - name: Maliye Bütçe Raporu Scraper'ı çalıştır
        run: python budget_scraper.py

      - name: Paylaşım önizleme görselini (og.png) üret
        run: python og.py data.json og.png index.html

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json budget_data.json og.png index.html
          git diff --staged --quiet || git commit -m "🔄 Veri güncellendi: $(date -u +%Y-%m-%d_%H:%M)"
          git push
